<!DOCTYPE html>
<html>
<head>
    <title>My City Map</title>
</head>
<body>

    <h1>Google Map</h1>

    <!-- loading="lazy" loads the map only when it is needed, improving page loading speed -->

    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d..."
        title="Google Map showing my city"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
