<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>
</head>
<body>

    <h1>Upload Image</h1>

    <form>

        <label for="file">Choose an image:</label>
        <input type="file" id="file" name="file" accept=".jpg, .png">

        <p>Only JPG and PNG image files are allowed.</p>

        <br>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
