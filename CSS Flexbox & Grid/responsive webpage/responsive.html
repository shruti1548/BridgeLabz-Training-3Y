<!DOCTYPE html>
<html>
<head>
    <title>Responsive Website</title>
    <link rel="stylesheet" href="responsive.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h2>My Website</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <!-- Main -->
    <main>

        <!-- Article -->
        <article>

            <h1>Welcome to My Website</h1>

            <p>
                This is my responsive webpage created using
                Flexbox and CSS Grid.
            </p>

            <!-- Three Boxes -->
            <div class="boxes">

                <div class="box">
                    <h3>HTML</h3>
                    <p>Structure of webpages.</p>
                </div>

                <div class="box">
                    <h3>CSS</h3>
                    <p>Styling of webpages.</p>
                </div>

                <div class="box">
                    <h3>JavaScript</h3>
                    <p>Adds functionality.</p>
                </div>

            </div>

        </article>

        <!-- Sidebar -->
        <aside>
            <h2>Sidebar</h2>
            <p>Latest Posts</p>
            <p>Categories</p>
            <p>Popular Articles</p>
        </aside>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
