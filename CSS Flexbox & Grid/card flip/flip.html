<!DOCTYPE html>
<html>
<head>
    <title>Card Flip</title>
    <link rel="stylesheet" href="flip.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <!-- Front -->
            <div class="front">
                <img src="https://picsum.photos/300/200">
                <h2>Web Development</h2>
            </div>

            <!-- Back -->
            <div class="back">
                <h2>About</h2>
                <p>
                    Web development is used to create websites
                    and web applications.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
