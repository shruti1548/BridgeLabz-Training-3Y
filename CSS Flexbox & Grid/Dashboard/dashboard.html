<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <div class="dashboard">

        <header>
            <h1>Dashboard</h1>
        </header>

        <aside>
            <h3>Menu</h3>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main>

            <div class="box">
                <h2>Users</h2>
                <p>120 Users</p>
            </div>

            <div class="box">
                <h2>Sales</h2>
                <p>₹50,000</p>
            </div>

            <div class="box">
                <h2>Projects</h2>
                <p>25 Projects</p>
            </div>

            <div class="box">
                <h2>Messages</h2>
                <p>15 New Messages</p>
            </div>

            <div class="box large">
                <h2>Reports</h2>
                <p>Monthly report and statistics</p>
            </div>

        </main>

    </div>

</body>
</html>
