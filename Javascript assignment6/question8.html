<!DOCTYPE html>
<html>
<head>
    <title>Custom Dropdown</title>

    <style>
        #dropdownOptions {
            display: none;
            width: 150px;
            border: 1px solid black;
        }

        #dropdownOptions div {
            padding: 10px;
            cursor: pointer;
        }

        #dropdownOptions div:hover {
            background-color: lightgray;
        }
    </style>
</head>
<body>

    <h2>Custom Dropdown</h2>

    <div id="dropdown">

        <button id="dropdownButton">Select Option</button>

        <div id="dropdownOptions">
            <div>HTML</div>
            <div>CSS</div>
            <div>JavaScript</div>
            <div>Python</div>
        </div>

    </div>

    <script src="question8.js"></script>
</body>
</html>
