<!DOCTYPE html>
<html>
<head>
    <title>Student Report</title>
</head>

<body>

    <h1>GLA University</h1>

    <h2>Student Report Card</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
            <th rowspan="2">Grade</th>
        </tr>

        <tr>
            <th>Maximum</th>
            <th>Obtained</th>
        </tr>

        <tr>
            <td title="Computer Science subject">Computer Science</td>
            <td>100</td>
            <td>85</td>
            <td>A</td>
        </tr>

        <tr>
            <td title="Mathematics subject">Mathematics</td>
            <td>100</td>
            <td>80</td>
            <td>A</td>
        </tr>

        <tr>
            <td title="Database Management System">DBMS</td>
            <td>100</td>
            <td>78</td>
            <td>B+</td>
        </tr>

        <tr>
            <td title="Operating Systems subject">Operating System</td>
            <td>100</td>
            <td>82</td>
            <td>A</td>
        </tr>

        <tr>
            <td title="Data Structures subject">DSA</td>
            <td>100</td>
            <td>88</td>
            <td>A+</td>
        </tr>

        <tr>
            <th colspan="2">Total</th>
            <td>413 / 500</td>
            <td>A</td>
        </tr>

        <tr>
            <th colspan="2">Percentage</th>
            <td colspan="2">82.6%</td>
        </tr>

    </table>

</body>
</html>
