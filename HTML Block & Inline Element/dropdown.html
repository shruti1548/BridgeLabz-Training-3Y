<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>

<body>

    <h1>Select Your Travel Destination</h1>

    <label>Country:</label>

    <select>
        <option selected>India</option>
        <option>France</option>
        <option>UAE</option>
        <option>Switzerland</option>
    </select>

    <br><br>

    <label>State:</label>

    <select>
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
    </select>

    <br><br>

    <label>City:</label>

    <select>
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Delhi</option>
        <option>Jaipur</option>
    </select>

    <br><br>

    <label>Favorite Tourist Place:</label>

    <select>
        <option selected>Taj Mahal</option>
        <option>Red Fort</option>
        <option>Gateway of India</option>
        <option>India Gate</option>
    </select>

    <h2>Your Choices</h2>

    <p>
        You selected India, Uttar Pradesh, Mathura,
        and Taj Mahal as your favorite tourist place.
    </p>

</body>
</html>
