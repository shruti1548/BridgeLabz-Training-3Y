<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Special Offers</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .banner {
            padding: 30px;
            margin: 15px;
            background-color: lightblue;
            border: 1px solid gray;
        }

        button {
            margin: 5px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h1>Special Offers</h1>

    <main>

        <div class="banner">50% OFF on Electronics!</div>
        <div class="banner">Buy One Get One Free!</div>
        <div class="banner">Special Weekend Sale!</div>
        <div class="banner">Free Delivery on Orders Above ₹999!</div>
        <div class="banner">Extra 20% OFF for Members!</div>

    </main>

    <button id="hide">Hide</button>
    <button id="show">Show</button>
    <button id="slideUp">Slide Up</button>
    <button id="slideDown">Slide Down</button>
    <button id="fadeIn">Fade In</button>
    <button id="fadeOut">Fade Out</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="offers.js"></script>
</body>
</html>
