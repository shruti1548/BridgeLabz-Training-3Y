<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Page</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        button {
            padding: 10px 15px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="greeting">Welcome!</h1>
    </header>

    <main>
        <p id="welcomeMessage">We are happy to have you here!</p>

        <button id="changeGreeting">Change Greeting</button>
        <button id="toggleMessage">Toggle Welcome Message</button>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="welcome.js"></script>
</body>
</html>
