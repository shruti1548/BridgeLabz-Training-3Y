<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">
            <img src="image1.jpg" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="photo">
            <img src="image2.jpg" alt="Mountains">
            <div class="caption">Mountains</div>
        </div>

        <div class="photo">
            <img src="image3.jpg" alt="Beach">
            <div class="caption">Beach</div>
        </div>

        <div class="photo">
            <img src="image4.jpg" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="image5.jpg" alt="City">
            <div class="caption">City Life</div>
        </div>

        <div class="photo">
            <img src="image6.jpg" alt="Sunset">
            <div class="caption">Sunset</div>
        </div>

    </div>

</body>
</html>
