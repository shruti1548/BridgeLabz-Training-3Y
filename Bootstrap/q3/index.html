<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="product-catalog.css">
</head>
<body>

    <header class="bg-dark text-white text-center p-4">
        <h1>Tech Store</h1>
        <p class="mb-0">Find the latest technology products</p>
    </header>

    <main class="container my-5">

        <h2 class="text-center mb-4">Our Products</h2>

        <!-- Bootstrap row and responsive columns -->
        <section class="row g-4">

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/300/200?1"
                         class="card-img-top" alt="Laptop">

                    <div class="card-body text-center">
                        <h5 class="card-title">Laptop</h5>
                        <p class="text-primary fw-bold">₹55,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/300/200?2"
                         class="card-img-top" alt="Headphones">

                    <div class="card-body text-center">
                        <h5 class="card-title">Headphones</h5>
                        <p class="text-primary fw-bold">₹2,500</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/300/200?3"
                         class="card-img-top" alt="Smartwatch">

                    <div class="card-body text-center">
                        <h5 class="card-title">Smartwatch</h5>
                        <p class="text-primary fw-bold">₹4,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/300/200?4"
                         class="card-img-top" alt="Camera">

                    <div class="card-body text-center">
                        <h5 class="card-title">Camera</h5>
                        <p class="text-primary fw-bold">₹35,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 Tech Store</p>
    </footer>

</body>
</html>
