<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="task-tracker.css">
</head>
<body>

    <header class="bg-dark text-white p-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">My Task Tracker</h1>

            <!-- Badge counter -->
            <span class="badge bg-danger fs-6">
                4 Pending
            </span>
        </div>
    </header>

    <main class="container my-5">

        <section class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">My Tasks</h2>
            </div>

            <!-- Bootstrap list group -->
            <ul class="list-group list-group-flush">

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Complete Assignment
                    <span class="badge bg-danger">High</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Prepare for Interview
                    <span class="badge bg-warning text-dark">Medium</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Read Documentation
                    <span class="badge bg-success">Low</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Submit Project
                    <span class="badge bg-danger">High</span>
                </li>

            </ul>

            <div class="card-body text-end">
                <!-- Button with embedded badge -->
                <button class="btn btn-success">
                    Completed
                    <span class="badge bg-light text-dark ms-2">2</span>
                </button>
            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">Stay Organized. Stay Productive.</p>
    </footer>

</body>
</html>
