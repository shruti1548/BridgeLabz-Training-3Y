<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="personal-portfolio.css">
</head>
<body class="bg-light text-dark">

    <header class="text-center bg-white p-5">
        <h1 class="fw-bold">Shruti Gupta</h1>
        <p class="lead">Computer Science Student | Aspiring Data Scientist</p>
    </header>

    <main class="container mt-4">

        <section class="text-center p-4">

            <!-- Responsive circular profile image -->
            <img src="https://i.pravatar.cc/200"
                 alt="Profile Photo"
                 class="img-fluid rounded-circle profile-img">

            <h2 class="mt-4 mb-3">About Me</h2>

            <p>
                I am a Computer Science student interested in
                programming, web development and artificial intelligence.
                I enjoy learning new technologies and building projects.
            </p>

            <!-- Bootstrap buttons -->
            <a href="#" class="btn btn-primary me-2">Hire Me</a>
            <a href="#" class="btn btn-outline-dark">Download CV</a>

        </section>

        <!-- Contact Form -->
        <section class="bg-white p-4 rounded shadow-sm mt-4 mb-5">

            <h2 class="text-center mb-3">Contact Me</h2>

            <form>
                <div class="mb-3">
                    <label class="form-label">Your Name</label>
                    <input type="text" class="form-control"
                           placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control"
                           placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="3"
                              placeholder="Write your message"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Send Message
                </button>
            </form>

        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 Shruti Gupta</p>
    </footer>

</body>
</html>
