
<!DOCTYPE html>
<html>
<head>
    <title>Change Box Color</title>

    <style>
        #box {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            margin: 50px auto;
            cursor: pointer;
            border: 2px solid black;
        }
    </style>
</head>
<body>

    <div id="box"></div>

    <script>
        let box = document.getElementById("box");

        box.addEventListener("click", function() {
            box.style.backgroundColor = "pink";
        });
    </script>

</body>
</html>
