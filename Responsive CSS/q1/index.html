<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
        <p>Hover over images to remove their filters.</p>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure>
                <img class="grayscale" src="https://picsum.photos/id/1018/400/300" alt="Forest">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://picsum.photos/id/1011/400/300" alt="Nature">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure>
                <img class="brightness" src="https://picsum.photos/id/1016/400/300" alt="River">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://picsum.photos/id/1020/400/300" alt="Wildlife">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure>
                <img class="hue" src="https://picsum.photos/id/1039/400/300" alt="Ocean">
                <figcaption>Hue Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Image Filter Demonstration</p>
    </footer>

</body>
</html>
