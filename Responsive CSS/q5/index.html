<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>

    <header>
        <h1>Our Team</h1>
    </header>

    <main>
        <section class="container">

            <div class="card">
                <img src="https://i.pravatar.cc/300?img=12" alt="Profile of Rahul">
                <h2>Rahul</h2>
                <p>Web Developer</p>
            </div>

            <div class="card">
                <img src="https://i.pravatar.cc/300?img=47" alt="Profile of Priya">
                <h2>Priya</h2>
                <p>UI Designer</p>
            </div>

            <div class="card">
                <img src="https://i.pravatar.cc/300?img=33" alt="Profile of Aman">
                <h2>Aman</h2>
                <p>Software Engineer</p>
            </div>

        </section>
    </main>

</body>
</html>
