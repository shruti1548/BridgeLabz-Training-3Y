<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cards</title>
    <link rel="stylesheet" href="responsive-cards-media-queries.css">
</head>
<body>

    <header>
        <h1>Responsive Card Layout</h1>
    </header>

    <main>
        <section class="container">

            <div class="card">
                <h2>HTML</h2>
                <p>HTML creates the structure of webpages.</p>
            </div>

            <div class="card">
                <h2>CSS</h2>
                <p>CSS styles and designs webpages.</p>
            </div>

            <div class="card">
                <h2>JavaScript</h2>
                <p>JavaScript adds interactivity to webpages.</p>
            </div>

            <div class="card">
                <h2>Python</h2>
                <p>Python is a popular programming language.</p>
            </div>

        </section>
    </main>

</body>
</html>
