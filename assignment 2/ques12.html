<!DOCTYPE html>
<html>
<head>
    <title>Inline Formatting</title>
</head>
<body>

    <!-- Paragraph demonstrating different inline HTML elements -->
    <p>
        I am <strong>passionate about technology</strong> and
        <em>enjoy learning new skills</em>.
        <br>
        My current focus is <mark>web development</mark>.
        <small>This is a small additional note.</small>
    </p>

</body>
</html>
