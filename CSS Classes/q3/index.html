<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Gallery</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1015/400/300" alt="Mountain landscape">
                </div>
                <figcaption>Beautiful Mountains</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1018/400/300" alt="Forest landscape">
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1011/400/300" alt="Nature landscape">
                </div>
                <figcaption>Nature View</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1016/400/300" alt="River landscape">
                </div>
                <figcaption>Beautiful River</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1020/400/300" alt="Wildlife landscape">
                </div>
                <figcaption>Wildlife</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1039/400/300" alt="Ocean landscape">
                </div>
                <figcaption>Ocean View</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>My Image Gallery</p>
    </footer>

</body>
</html>
