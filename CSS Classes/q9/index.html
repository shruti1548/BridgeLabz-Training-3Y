<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Combined CSS Effects</h1>
    </header>

    <main>
        <section class="container">

            <div class="card">
                <h2>Hover Effect</h2>
                <p>Move your mouse over the button.</p>
                <button>Explore</button>
            </div>

            <div class="card">
                <h2>Transform Effect</h2>
                <p>Hover to see the transformation.</p>
                <button>Discover</button>
            </div>

            <div class="card">
                <h2>Active Effect</h2>
                <p>Press and hold the button.</p>
                <button>Click Me</button>
            </div>

        </section>
    </main>

</body>
</html>
