<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Box-Sizing Comparison</h1>
    </header>

    <main>

        <section class="container">

            <div class="box content-box">
                <h2>Content Box</h2>
                <p>Uses the default box-sizing property.</p>
            </div>

            <div class="box border-box">
                <h2>Border Box</h2>
                <p>Includes padding and border in its width.</p>
            </div>

        </section>

        <p class="description">
            Content-box adds padding and border outside the specified width.
            Border-box includes padding and border within the specified width.
        </p>

    </main>

</body>
</html>
