<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Tooltip Demonstration</h1>
        <p>Move your mouse over the examples.</p>
    </header>

    <main>
        <section class="container">

            <div class="tooltip">
                Home
                <span class="tooltip-text">Go to Homepage</span>
            </div>

            <div class="tooltip">
                Search
                <span class="tooltip-text">Search for information</span>
            </div>

            <div class="tooltip">
                Profile
                <span class="tooltip-text">View your Profile</span>
            </div>

            <div class="tooltip">
                Settings
                <span class="tooltip-text">Change your Settings</span>
            </div>

        </section>
    </main>

</body>
</html>
